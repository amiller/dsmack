name: Mac App Attest capability probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: OS and App Attest capability (unsigned, no keys or secrets)
        run: bash scripts/release/probe_mac_app_attest.sh
