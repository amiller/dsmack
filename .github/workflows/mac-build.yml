name: Mac unsigned build and reproducibility
on:
  pull_request:
    paths: ['node/**', 'scripts/release/**', 'scripts/cd_args.py', 'scripts/macho_pages.py', 'scripts/cd_layout.py', '.github/workflows/mac-build.yml']
  push:
    branches: [main, 'release/**']
    paths: ['node/**', 'scripts/release/**', 'scripts/cd_args.py', 'scripts/macho_pages.py', 'scripts/cd_layout.py', '.github/workflows/mac-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        flavor: [cli, gui]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compare two unsigned builds
        run: python3 scripts/release/check_repro.py --out build/repro ${{ matrix.flavor == 'gui' && '--gui' || '' }}
      - name: Verify request ABI vectors
        run: |
          xcrun swiftc node/shared/Protocol.swift node/tests/RequestVectors.swift -o build/request-vectors
          build/request-vectors
      - name: Verify personal-account ABI and crypto vectors
        run: |
          xcrun swiftc node/shared/Protocol.swift node/shared/PersonalAccount.swift node/tests/PersonalAccountVectors.swift -o build/personal-vectors
          build/personal-vectors
      - name: Verify code measurement vectors
        run: |
          xcrun swiftc node/shared/Protocol.swift node/shared/Measure.swift node/tests/MeasureVectors.swift -o build/measure-vectors
          build/measure-vectors
      - name: Verify measured enroll payload and directory heartbeat encoding
        run: |
          xcrun swiftc -framework DeviceCheck node/shared/*.swift node/tests/MeasuredEnrollTests.swift -o build/measured-enroll-tests
          build/measured-enroll-tests
          build/measured-enroll-tests --unsigned
          cp build/measured-enroll-tests build/measured-enroll-signed
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>com.apple.security.get-task-allow</key><true/></dict></plist>' > build/test-ent.plist
          codesign --force -s - --options runtime --entitlements build/test-ent.plist --generate-entitlement-der build/measured-enroll-signed
          build/measured-enroll-signed --self
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-${{ matrix.flavor }}-unsigned-reproducibility
          path: build/repro/
          retention-days: 14
          if-no-files-found: error
  measure-two-teams:
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      m_honest_a: ${{ steps.measure.outputs.m_honest_a }}
      m_honest_b: ${{ steps.measure.outputs.m_honest_b }}
      m_modified: ${{ steps.measure.outputs.m_modified }}
      cdhash_honest_a: ${{ steps.measure.outputs.cdhash_honest_a }}
      cdhash_honest_b: ${{ steps.measure.outputs.cdhash_honest_b }}
      cdhash_modified: ${{ steps.measure.outputs.cdhash_modified }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: One measurement for two teams, another for a modified build
        id: measure
        run: |
          scripts/release/measure_two_teams.sh build/measure
          tee -a "$GITHUB_OUTPUT" < build/measure/vectors/outputs.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: measure-two-teams
          path: build/measure/vectors/
          retention-days: 14
          if-no-files-found: error
