[profile.default]
src = "src"
test = "test"
solc_version = "0.8.21"
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["lib"]
skip = ["test/zk/**"]
fs_permissions = [{ access = "read", path = "./fixtures" }]
remappings = ["forge-std/=lib/forge-std/src/", "attest/=src/"]

[profile.real]
evm_version = "osaka"
test = "test/zk"
skip = []
fs_permissions = [{ access = "read", path = "./fixtures" }, { access = "read", path = "../circuit" }, { access = "read", path = "./verifier/out" }]
