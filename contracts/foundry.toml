[profile.default]
src = "src"
test = "test"
solc_version = "0.8.21"
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./fixtures" }, { access = "read-write", path = "./network" }]
remappings = ["forge-std/=lib/forge-std/src/", "openzeppelin-contracts/=lib/openzeppelin-contracts/"]
