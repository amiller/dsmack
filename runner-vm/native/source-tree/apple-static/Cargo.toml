[package]
name = "dsmack-hvf-returning"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
krun = { package = "libkrun", path = "../source/src/libkrun", default-features = false, features = ["blk", "net"] }
devices = { package = "krun-devices", path = "../source/src/devices", default-features = false, features = ["blk", "net"] }
libc = "0.2"
dsmack-backend-v3 = { path = "backend-v3" }

