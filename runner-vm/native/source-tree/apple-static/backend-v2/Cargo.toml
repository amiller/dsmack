[package]
name = "dsmack-backend"
version = "0.2.0"
edition = "2021"
description = "Generic native backend for the dsmack general launcher: control-profile ABI v2 (external admitted launch_spec, owned-buffer verified boot R1-R5, vda/vdb/vdc disk triple, resource profiles). mac-backend-implementation lane 2026-10-21. Source-level only: no Mac build/sign/VM happened in this lane; the HVF consumption is cfg-gated for aarch64 macOS and provided by the integration patch against morning/source3 apple-static."

[dependencies]
sha2 = "0.10.9"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
thiserror = "2.0"
libc = "0.2"

[lib]
name = "dsmack_backend"
