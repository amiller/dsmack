[package]
name = "dsmack-backend-v3"
version = "0.3.0"
edition = "2021"
description = "dsmack v3 native backend: admitted launch spec, verified boot, five-role disk set, result finalization, optional virtio-net."

[dependencies]
sha2 = "0.10.9"
thiserror = "2.0"
libc = "0.2"

[features]
# owned_verified.rs carries a cfg(feature = "ffi") attribute from upstream.
ffi = []

[lib]
name = "dsmack_backend_v3"
