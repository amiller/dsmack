[package]
name = "dsmack-ethereum-finality"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "2af9b41887e069144ee56cd710f3ddca195473f8" }
alloy = { version = "=2.1.0", features = ["rpc-types", "consensus", "sol-types", "network"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
libc = "=0.2.174"

[patch.crates-io]
# Preserve the immutable upstream workspace's consensus hashing patch.
ethereum_hashing = { git = "https://github.com/ncitron/ethereum_hashing", rev = "7ee70944ed4fabe301551da8c447e4f4ae5e6c35" }

[workspace]
